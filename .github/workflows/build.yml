name: Build Cross-Platform Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend (Vite)
        run: npm run build

      - name: Build Desktop App (Windows)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win --publish never

      - name: Build Desktop App (macOS)
        if: matrix.platform == 'macos'
        run: npx electron-builder --mac --publish never

      - name: Upload Windows Installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Nai-Agent-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Upload macOS Installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: Nai-Agent-macOS-Installer
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Update GitHub Release (Windows)
        if: matrix.platform == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nai_Agent
          name: "Nai Agent for Windows"
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release (macOS)
        if: matrix.platform == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nai_Agent_mac
          name: "Nai Agent for Mac"
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

